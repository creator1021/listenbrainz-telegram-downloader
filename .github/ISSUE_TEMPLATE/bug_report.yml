name: Bug report
description: Report a reproducible problem without exposing credentials.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never include Telegram API hashes, login codes, session files, or tokens.
  - type: input
    id: version
    attributes:
      label: Version or Docker tag
      placeholder: v0.0.1
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - linux/amd64
        - linux/arm64
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove usernames, channel IDs, tokens, phone numbers, and file paths if sensitive.
      render: shell
